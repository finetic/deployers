---
name: "Statamic Backend Test"
description: "Runs composer install + static analysis for Statamic projects"

inputs:
  php-version:
    description: "PHP version"
    required: false
    default: "8.4"

  redirect-log-errors:
    description: Override redirect error logging during PHPStan
    required: false
    default: ""

  composer-auth:
    description: "Composer auth.json content"
    required: true

runs:
  using: "composite"
  steps:

    - name: 🧾 Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Use reachable Ubuntu package mirror on Gitea
      if: ${{ github.server_url == 'https://git.statamic.finetic.dev' }}
      shell: bash
      run: |
        set -euo pipefail
        sources=/etc/apt/sources.list.d/ubuntu.sources
        if [[ -f "$sources" ]]; then
          elevate=()
          if (( EUID != 0 )); then
            elevate=(sudo)
          fi
          "${elevate[@]}" sed -i -E 's@https?://(archive|security)\.ubuntu\.com/ubuntu@https://mirrors.edge.kernel.org/ubuntu@g' "$sources"
        fi

    - name: 🧪 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs['php-version'] }}
        extensions: sodium, mbstring, xml, ctype
        ini-values: |
          memory_limit=-1
          opcache.enable_cli=1
          opcache.jit=0
      env:
        sodium_libs: libsodium-dev

    - name: Cache composer
      uses: actions/cache@v5
      with:
        path: |
          /tmp/composer-cache
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}

    - name: Setup COMPOSER_AUTH
      run: |
        set -euo pipefail
        mkdir -p ~/.config/composer
        printf "%s" '${{ inputs['composer-auth'] }}' > ~/.config/composer/auth.json
      shell: bash

    - name: 📦 Install Composer Dependencies
      env:
        COMPOSER_MEMORY_LIMIT: -1
        COMPOSER_MAX_PARALLEL_HTTP: 10
        COMPOSER_CACHE_DIR: /tmp/composer-cache
      run: |
        set -euo pipefail

        composer install \
          --no-interaction \
          --no-progress \
          --prefer-dist \
          --no-scripts \
          --no-progress \
          --optimize-autoloader \
          --ansi
      shell: bash

    - name: Static Analysis
      env:
        REDIRECT_LOG_ERRORS_OVERRIDE: ${{ inputs['redirect-log-errors'] }}
      run: |
        set -euo pipefail

        echo "Running PHPCS..."
        vendor/bin/phpcs --parallel=$(nproc)

        if [[ -n "$REDIRECT_LOG_ERRORS_OVERRIDE" ]]; then
          export REDIRECT_LOG_ERRORS="$REDIRECT_LOG_ERRORS_OVERRIDE"
        fi
        echo "Running PHPStan..."
        vendor/bin/phpstan --no-progress --memory-limit=1G
      shell: bash
