---
name: Dependency-Track composer
description: Generate and upload a composer SBOM with explicit credentials
inputs:
  composer_location:
    description: Directory containing the dependency manifest
    required: false
    default: '.'
  project_uuid:
    description: Existing Dependency-Track project UUID
    required: true
  server_hostname:
    description: Dependency-Track hostname without the protocol
    required: true
  api_key:
    description: Dependency-Track API key
    required: true
runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        extensions: dom,json,libxml
        tools: 'composer:v2'

    - name: Install SBOM composer plugin
      working-directory: ${{ inputs.composer_location }}
      shell: bash
      run: |-
        set -euo pipefail
        composer global config --no-plugins allow-plugins.cyclonedx/cyclonedx-php-composer true
        composer global require cyclonedx/cyclonedx-php-composer

    - name: Create SBOM step
      # see for usage: https://packagist.org/packages/cyclonedx/cyclonedx-php-composer
      working-directory: ${{ inputs.composer_location }}
      shell: bash
      run: |-
        set -euo pipefail
        composer CycloneDX:make-sbom --output-format=JSON --output-file=sbom.json --validate

    - name: Check SBOM file
      working-directory: ${{ inputs.composer_location }}
      shell: bash
      run: |-
        set -euo pipefail
        test -s sbom.json

    - name: upload
      id: upload
      uses: DependencyTrack/gh-upload-sbom@v4
      with:
        server-hostname: ${{ inputs.server_hostname }}
        api-key: ${{ inputs.api_key }}
        project: ${{ inputs.project_uuid }}
        bom-filename: ${{ inputs.composer_location }}/sbom.json
        auto-create: false

    # Temporary: repeat a failed upload once to expose the server's rejection details.
    - name: Diagnose failed Dependency-Track upload
      if: ${{ failure() && steps.upload.outcome == 'failure' }}
      working-directory: ${{ inputs.composer_location }}
      env:
        DEPENDENCY_TRACK_HOSTNAME: ${{ inputs.server_hostname }}
        DEPENDENCY_TRACK_API_KEY: ${{ inputs.api_key }}
        PROJECT_UUID: ${{ inputs.project_uuid }}
      shell: bash
      run: |-
        set -euo pipefail
        test -s sbom.json
        response_file="$(mktemp)"
        trap 'rm -f "$response_file"' EXIT
        status=$(curl --silent --show-error \
          --connect-timeout 30 --max-time 120 \
          --output "$response_file" --write-out '%{http_code}' \
          --header "X-Api-Key: ${DEPENDENCY_TRACK_API_KEY}" \
          --form-string "project=${PROJECT_UUID}" \
          --form 'bom=@sbom.json;filename=bom;type=application/octet-stream' \
          "https://${DEPENDENCY_TRACK_HOSTNAME}/api/v1/bom")
        echo "Diagnostic upload HTTP status: ${status}"
        python3 - "$response_file" <<'PY'
        import os
        import sys
        from pathlib import Path

        body = Path(sys.argv[1]).read_text(errors="replace")
        key = os.environ["DEPENDENCY_TRACK_API_KEY"]
        if key:
            body = body.replace(key, "***")
        for line in body.splitlines():
            print(f"Dependency-Track response: {line}")
        if not body:
            print("Dependency-Track returned an empty response body.")
        PY
