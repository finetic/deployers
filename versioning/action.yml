---
name: "Version and Release"
description: "Create a VERSION-based tag and GitHub release with grouped release notes"

inputs:
  github_token:
    description: "Token with contents: write permission"
    required: true
  git_username:
    description: "Git author name used for the annotated tag"
    required: false
    default: "github-actions[bot]"
  git_email:
    description: "Git author email used for the annotated tag"
    required: false
    default: "41898282+github-actions[bot]@users.noreply.github.com"
  version_file:
    description: "Path to the semantic version file"
    required: false
    default: "VERSION"

outputs:
  tag:
    description: "Resolved release tag"
    value: ${{ steps.version.outputs.tag }}
  released:
    description: "Whether a new tag and GitHub release were created"
    value: ${{ steps.result.outputs.released }}

runs:
  using: "composite"
  steps:
    - name: Checkout full history
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        token: ${{ inputs.github_token }}

    - name: Configure Git
      shell: bash
      env:
        GIT_USERNAME: ${{ inputs.git_username }}
        GIT_EMAIL: ${{ inputs.git_email }}
      run: |
        set -euo pipefail

        git config user.name "$GIT_USERNAME"
        git config user.email "$GIT_EMAIL"

    - name: Validate contents write permission
      shell: bash
      run: |
        set -euo pipefail

        TEMPORARY_TAG="__permission_check__${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        if ! git push --dry-run origin "HEAD:refs/tags/${TEMPORARY_TAG}" > /tmp/versioning-permission.log 2>&1; then
          echo "::error::The workflow requires permissions: contents: write"
          sed -e 's/^/  /' /tmp/versioning-permission.log || true
          exit 1
        fi

    - name: Read version
      id: version
      shell: bash
      env:
        VERSION_FILE: ${{ inputs.version_file }}
      run: |
        set -euo pipefail

        if [[ ! -f "$VERSION_FILE" ]]; then
          echo "::error::Version file not found: ${VERSION_FILE}"
          exit 1
        fi

        VERSION="$(tr -d '\n\r ' < "$VERSION_FILE")"
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::VERSION must use the x.y.z format"
          exit 1
        fi

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Check release tag
      id: release
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail

        if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} already exists"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build release notes
      if: steps.release.outputs.exists == 'false'
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail

        PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
        if [[ "$PREVIOUS_TAG" == "$TAG" ]]; then
          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | sed -n '2p')"
        fi

        if [[ -n "$PREVIOUS_TAG" ]]; then
          RANGE="${PREVIOUS_TAG}..HEAD"
        else
          RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
        fi

        git log --no-merges --pretty=format:'%H%x09%h%x09%s%x09%an' "$RANGE" \
          | grep -vi '\[skip ci\]' > /tmp/versioning-commits.tsv || true

        if [[ ! -s /tmp/versioning-commits.tsv ]]; then
          echo "- No user-visible changes." > release_notes.md
          exit 0
        fi

        TYPES=("feat" "fix" "perf" "refactor" "docs" "test" "build" "ci" "style" "chore" "revert")
        declare -A FILES
        for type in "${TYPES[@]}"; do
          FILES["$type"]="/tmp/versioning-section-${type}.lst"
          : > "${FILES[$type]}"
        done
        OTHER="/tmp/versioning-section-other.lst"
        : > "$OTHER"

        while IFS=$'\t' read -r _hash short subject author; do
          lowercase_subject="$(printf "%s" "$subject" | awk '{ print tolower($0) }')"
          if [[ "$lowercase_subject" =~ ^([a-z0-9-]+)(\([^\)]*\))?:[[:space:]]+ ]]; then
            type="${BASH_REMATCH[1]}"
          else
            type="other"
          fi

          number="$(printf "%s" "$subject" \
            | grep -oE '[A-Z]+-[0-9]+' \
            | head -n1 \
            | grep -oE '[0-9]+' || true)"
          if [[ -z "$number" ]]; then
            number="$(printf "%s" "$subject" | grep -oE '[0-9]+' | head -n1 || true)"
          fi

          number="${number:-99999999}"
          sort_number="$(printf "%08d" "$number")"
          line="- ${subject} (${short}) — ${author}"

          if [[ " ${TYPES[*]} " == *" ${type} "* ]]; then
            echo "${sort_number}|${line}" >> "${FILES[$type]}"
          else
            echo "${sort_number}|${line}" >> "$OTHER"
          fi
        done < /tmp/versioning-commits.tsv

        : > release_notes.md
        write_section() {
          local header="$1"
          local file="$2"
          if [[ -s "$file" ]]; then
            echo "### ${header}" >> release_notes.md
            sort -t'|' -k1,1n "$file" | cut -d'|' -f2- >> release_notes.md
            echo "" >> release_notes.md
          fi
        }

        write_section "Features" "${FILES[feat]}"
        write_section "Fixes" "${FILES[fix]}"
        write_section "Performance" "${FILES[perf]}"
        write_section "Refactoring" "${FILES[refactor]}"
        write_section "Docs" "${FILES[docs]}"
        write_section "Tests" "${FILES[test]}"
        write_section "Build" "${FILES[build]}"
        write_section "CI" "${FILES[ci]}"
        write_section "Style" "${FILES[style]}"
        write_section "Chores" "${FILES[chore]}"
        write_section "Reverts" "${FILES[revert]}"
        write_section "Overige" "$OTHER"

        if [[ ! -s release_notes.md ]]; then
          echo "- No user-visible changes." > release_notes.md
        fi

    - name: Create annotated tag
      if: steps.release.outputs.exists == 'false'
      shell: bash
      env:
        TAG: ${{ steps.version.outputs.tag }}
      run: |
        set -euo pipefail

        git tag -a "$TAG" -m "Release ${TAG}"
        git push origin "refs/tags/${TAG}"

    - name: Create GitHub release
      if: steps.release.outputs.exists == 'false'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        body_path: release_notes.md
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Set result
      id: result
      shell: bash
      env:
        TAG_EXISTS: ${{ steps.release.outputs.exists }}
      run: |
        set -euo pipefail

        if [[ "$TAG_EXISTS" == "false" ]]; then
          echo "released=true" >> "$GITHUB_OUTPUT"
        else
          echo "released=false" >> "$GITHUB_OUTPUT"
        fi
