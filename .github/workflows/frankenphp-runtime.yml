---
name: FrankenPHP runtime

on:
  pull_request:
    paths:
      - 'frankenphp-runtime/**'
      - '.github/workflows/frankenphp-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frankenphp-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    defaults:
      run:
        working-directory: frankenphp-runtime
    env:
      PHP_VERSION: ${{ matrix.php }}
      REPOSITORY: docker.finetic.dev/finetic/runtime/frankenphp
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build and test both architectures
        shell: bash
        run: |
          set -euo pipefail
          docker buildx bake --file docker-bake.hcl smoke
          for arch in amd64 arm64; do
            docker run --rm -i --platform "linux/$arch" --entrypoint php \
              "frankenphp-runtime-test:$arch" -f /dev/stdin -- "$PHP_VERSION" < smoke.php
          done

      - name: Log in to the Finetic registry
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: docker.finetic.dev
          username: ${{ secrets.nexus_docker_username }}
          password: ${{ secrets.nexus_docker_password }}

      - name: Publish runtime to Nexus
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx bake --file docker-bake.hcl publish
          docker buildx imagetools inspect "$REPOSITORY:frankenphp-php${PHP_VERSION}"
