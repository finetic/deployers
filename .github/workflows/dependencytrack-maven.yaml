---
name: Dependency Track

on:
  workflow_call:
    inputs:
      pom_location:
        required: false
        type: string
        default: '.'
      project_uuid:
        required: true
        type: string

jobs:
  generate-sbom:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Java and Maven
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      - name: Install SBOM plugin
        working-directory: ${{ inputs.pom_location }}
        run: |-
          set -euo pipefail
          mvn clean package

      - name: Check SBOM file
        working-directory: ${{ inputs.pom_location }}
        run: |-
          set -euo pipefail
          test -s target/bom.xml

      - name: upload
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          server-hostname: ${{ vars.DEPENDENCY_TRACK_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: ${{ inputs.project_uuid }}
          bom-filename: ${{ inputs.pom_location }}/target/bom.xml
          auto-create: false
