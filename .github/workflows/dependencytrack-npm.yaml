---
name: Dependency Track

on:
  workflow_call:
    inputs:
      package_location:
        required: false
        type: string
        default: '.'
      project_uuid:
        required: true
        type: string

jobs:
  generate-sbom:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install SBOM plugin
        working-directory: ${{ inputs.package_location }}
        run: |-
          set -euo pipefail
          npm install --global @cyclonedx/cyclonedx-npm

      - name: Install npm packages
        working-directory: ${{ inputs.package_location }}
        run: |-
          set -euo pipefail
          npm ci

      - name: Create SBOM step
        # see for usage: https://www.npmjs.com/package/@cyclonedx/cyclonedx-npm
        working-directory: ${{ inputs.package_location }}
        run: |-
          set -euo pipefail
          cyclonedx-npm --output-format XML --output-file sbom.xml --validate --ignore-npm-errors

      - name: Check SBOM file
        working-directory: ${{ inputs.package_location }}
        run: |-
          set -euo pipefail
          test -s sbom.xml

      - name: upload
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          server-hostname: ${{ vars.DEPENDENCY_TRACK_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: ${{ inputs.project_uuid }}
          bom-filename: ${{ inputs.package_location }}/sbom.xml
          auto-create: false
