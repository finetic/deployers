---
name: Dependency Track

on:
  workflow_call:
    inputs:
      composer_location:
        required: false
        type: string
        default: '.'
      project_uuid:
        required: true
        type: string

jobs:
  generate-sbom:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          extensions: dom,json,libxml
          tools: 'composer:v2'

      - name: Install SBOM composer plugin
        working-directory: ${{ inputs.composer_location }}
        run: |-
          set -euo pipefail
          composer global config --no-plugins allow-plugins.cyclonedx/cyclonedx-php-composer true
          composer global require cyclonedx/cyclonedx-php-composer

      - name: Create SBOM step
        # see for usage: https://packagist.org/packages/cyclonedx/cyclonedx-php-composer
        working-directory: ${{ inputs.composer_location }}
        run: |-
          set -euo pipefail
          composer CycloneDX:make-sbom --output-file=sbom.xml --validate

      - name: Check SBOM file
        working-directory: ${{ inputs.composer_location }}
        run: |-
          set -euo pipefail
          test -s sbom.xml

      - name: upload
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          server-hostname: ${{ vars.DEPENDENCY_TRACK_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: ${{ inputs.project_uuid }}
          bom-filename: ${{ inputs.composer_location }}/sbom.xml
          auto-create: false
