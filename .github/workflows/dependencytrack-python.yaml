---
name: Dependency Track

on:
  workflow_call:
    inputs:
      requirements_location:
        required: false
        type: string
        default: '.'
      project_uuid:
        required: true
        type: string

jobs:
  generate-sbom:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install SBOM plugin
        working-directory: ${{ inputs.requirements_location }}
        run: |-
          set -euo pipefail
          python3 -m venv venv
          source ./venv/bin/activate
          python3 -m pip install -r requirements.txt
          python3 -m pip install cyclonedx-bom
          cyclonedx-py environment --output-format JSON --output-file sbom.json --validate

      - name: Check SBOM file
        working-directory: ${{ inputs.requirements_location }}
        run: |-
          set -euo pipefail
          test -s sbom.json

      - name: upload
        uses: DependencyTrack/gh-upload-sbom@v4
        with:
          server-hostname: ${{ vars.DEPENDENCY_TRACK_HOSTNAME }}
          api-key: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
          project: ${{ inputs.project_uuid }}
          bom-filename: ${{ inputs.requirements_location }}/sbom.json
          auto-create: false
